[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "radioskysims-waterfall"
version = "0.1.0"
description = "Ferramentas de gerenciamento de waterfalls (tempo x frequencia) para radioastronomia."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
license = { text = "MIT" }
authors = [
  { name = "BINGO Collaboration", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.9",
  "xarray>=2022.3.1",
  "dask[array]>=2023.1.0",
  "astropy>=5.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.0", "h5netcdf>=1.0", "netCDF4>=1.5"]
zarr = ["zarr>=2.13"]
fits = ["astropy[io.fits]>=5.0"]
plot = ["holoviews>=1.16", "datashader>=0.15", "panel>=1.0"]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "h5py>=3.0",
  "h5netcdf>=1.0",
  "netCDF4>=1.5",
  "zarr>=2.13",
  "holoviews>=1.16",
  "datashader>=0.15",
]
all = [
  "h5py>=3.0",
  "h5netcdf>=1.0",
  "netCDF4>=1.5",
  "zarr>=2.13",
  "holoviews>=1.16",
  "datashader>=0.15",
  "panel>=1.0",
]

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radioskysims_waterfall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "PLC", "PLW", "PT", "ARG"]
ignore = [
  "PLC0415", # imports lazy intencionais (deps opcionais / evitar ciclos)
  "ARG001",  # argumentos de assinatura não usados (ports, compatibilidade)
  "ARG002",
  "ARG004",
  "RUF002",  # caracteres unicode intencionais (µ em unidades)
  "PTH105",  # os.replace para escrita atômica
  "PLW0603", # estado de módulo intencional (_extension_loaded)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"] # pytest.raises(ValueError) sem match em testes unitários
